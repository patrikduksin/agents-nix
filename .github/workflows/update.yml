name: Update packages

on:
  schedule:
    - cron: "17 * * * *" # T3 nightlies, Claude Code and Codex all ship several times a day
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Each package is pinned, built and committed on its own, so one broken
      # release doesn't hold back the others. The build runs each binary's
      # --version (installCheckPhase), so a pin that can't start is dropped.
      - name: Pin, build and commit each package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed=()
          for pkg in t3code claude-code codex; do
            ./update.sh "$pkg" || { failed+=("$pkg"); git checkout -- "pkgs/$pkg"; continue; }
            git diff --quiet -- "pkgs/$pkg" && continue
            if nix build -L --no-link ".#$pkg"; then
              git commit -m "$pkg $(jq -r .version "pkgs/$pkg/sources.json")" -- "pkgs/$pkg"
            else
              failed+=("$pkg")
              git checkout -- "pkgs/$pkg"
            fi
          done
          git push
          [ ${#failed[@]} -eq 0 ] || { echo "::error::failed: ${failed[*]}"; exit 1; }
